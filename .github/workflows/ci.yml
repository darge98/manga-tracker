name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: manga_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d manga_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/manga_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  stack:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Security headers match between Nginx and vercel.json
        run: node scripts/check-security-headers.mjs
      - name: Validate Compose files
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example --profile test config --quiet
      - name: Build and start the stack
        run: docker compose --env-file .env.example up --build -d --wait
      - name: Check health and security headers
        run: |
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"storage":"postgres"'
          headers="$(curl -fsS -D - -o /dev/null http://127.0.0.1:8080/)"
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^x-frame-options: DENY'
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs
      - name: Stop the stack
        if: always()
        run: docker compose --env-file .env.example down --volumes
