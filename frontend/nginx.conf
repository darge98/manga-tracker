server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS: resolve again when the backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8080;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
    proxy_intercept_errors off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keep /api, path, query string and backend JSON responses unchanged.
    location = /api {
        proxy_pass http://$backend_upstream$request_uri;
    }
    location ^~ /api/ {
        proxy_pass http://$backend_upstream$request_uri;
    }

    # Missing assets must not return an HTML application document.
    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
